name: Deploy Static Website to S3

on:
  push:
    branches: [main]
  workflow_dispatch: # Allows manual triggering

# OIDC permissions for keyless authentication
permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Dump GitHub context
        run: echo "${{ toJson(github) }}"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Capture Code Stage Timestamp
        run: echo "CODE_TIMESTAMP=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_ENV

      - name: Run Tests
        run: echo "Running tests..."

      - name: Capture Test Stage Timestamp
        run: echo "TEST_TIMESTAMP=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_ENV

      - name: Build Website
        run: echo "Building website..."

      - name: Capture Build Stage Timestamp
        run: echo "BUILD_TIMESTAMP=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_ENV

      - name: Capture Deploy Stage Timestamp
        run: echo "DEPLOY_TIMESTAMP=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_ENV

      # Create a deployment info JavaScript file with timestamps for each stage
      - name: Update deployment timestamp
        run: |
          mkdir -p js
          cat > js/deployment-info.js << 'EOF'
          const DEPLOYMENT_INFO = {
            date: '${{ github.event.head_commit.timestamp }}',
            runId: '${{ github.run_id }}',
            commit: '${{ github.sha }}',
         };
          EOF
          echo "✓ deployment-info.js created successfully"
          cat js/deployment-info.js

      # # Configure AWS credentials
      # - name: Configure AWS credentials
      #   uses: aws-actions/configure-aws-credentials@v1
      #   with:
      #     aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
      #     aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      #     aws-region: "ap-south-1"

      # OIDC/IRSA Authentication - No more access keys!
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: gh-actions-${{ github.run_id }}
          aws-region: "us-east-1"

      # Deploy to S3 bucket - directly sync the repository contents
      - name: Deploy to S3
        run: |
          aws s3 sync ./ s3://${{ secrets.S3_BUCKET_NAME }} \
            --delete \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "README.md" \
            --exclude "js/deployment-info.js"

      # Upload deployment-info.js separately with no-cache headers
      - name: Upload deployment-info.js with cache control
        run: |
          aws s3 cp js/deployment-info.js s3://${{ secrets.S3_BUCKET_NAME }}/js/deployment-info.js \
            --cache-control "no-cache, no-store, must-revalidate" \
            --expires "0" \
            --metadata "timestamp=$(date)"
